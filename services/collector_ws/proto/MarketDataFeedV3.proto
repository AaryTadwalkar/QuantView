syntax = "proto3";

package com.upstox.marketdatafeeder.rpc.proto;

enum Type {
  initial_feed = 0;
  live_feed = 1;
}

message LTPC {
  double ltp = 1;
  int64 ltt = 2;
  int64 ltq = 3;
  double cp = 4;
}

message Quote {
  int32 bq = 1;
  double bp = 2;
  int32 bno = 3;
  int32 aq = 4;
  double ap = 5;
  int32 ano = 6;
}

message MarketLevel {
  repeated Quote bidAskQuote = 1;
}

message OHLC {
  string interval = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int32 volume = 6;
  int64 ts = 7;
}

message MarketOHLC {
  repeated OHLC ohlc = 1;
}

message OptionGreeks {
  double iv = 1;
  double delta = 2;
  double theta = 3;
  double gamma = 4;
  double vega = 5;
  double rho = 6;
}

message ExtendedFeedDetails {
  int64 atp = 1;
  int64 cp = 2;
  int64 vtt = 3;
  double oi = 4;
  double changeOi = 5;
  double lastTradedPrice = 6;
  int64 totalBuyQty = 7;
  int64 totalSellQty = 8;
  double lowerCircuit = 9;
  double upperCircuit = 10;
  double yearlyHigh = 11;
  double yearlyLow = 12;
}

message FullFeed {
  MarketLevel marketLevel = 1;
  MarketOHLC marketOHLC = 2;
  OptionGreeks optionGreeks = 3;
  ExtendedFeedDetails extendedFeedDetails = 4;
  LTPC ltpc = 5;
}

message Feed {
  oneof FeedUnion {
    LTPC ltpc = 1;
    FullFeed fullFeed = 2;
  }
}

message FeedResponse {
  Type type = 1;
  map<string, Feed> feeds = 2;
  int64 currentTs = 3;
}
