services:
  postgres:
    image: postgres:16-alpine
    container_name: quantview-postgres-test
    environment:
      POSTGRES_USER: qv_user
      POSTGRES_PASSWORD: qv_secret
      POSTGRES_DB: qv_core
    ports:
      - "5432:5432"
    volumes:
      - qv_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qv_user -d qv_core"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qv_pg_data:
