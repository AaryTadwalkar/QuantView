[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantview"
version = "0.1.0"
description = "Deterministic institutional algorithmic trading, backtesting, and paper engine for Indian index options"
authors = [{ name = "QuantView Engineering" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "import-linter>=2.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "gate_g0a: Skeleton, packaging boundaries, tooling and contract tests",
    "gate_g0: Collector durability, raw capture and manifest reconciliation tests",
    "gate_g1: Canonical data normalization, contract master and calendar tests",
    "gate_g2a: Deterministic single-leg execution engine and paise ledger tests",
    "gate_g2b: Multi-leg position group and margin guard tests",
    "gate_g3: Causal feature derivation and lookahead prevention tests",
    "gate_g4: API, charting viewport and order line tests",
    "gate_g5: Paper runtime replay, restart and isolation tests",
    "gate_g6: Research walk-forward and hold-out leakage tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]
