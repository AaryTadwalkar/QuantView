name: QuantView CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Clean Clone Verification & Gate Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Clean Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify Specification Consistency (13 Checks A-M)
        run: |
          python ops/verify_docs_consistency.py

      - name: Verify Specification Preservation Lint
        run: |
          python tools/qv_check.py lint DOCS stale.txt

      - name: Run Ruff Code Quality Lint
        run: |
          ruff check .

      - name: Verify Package Import Boundaries (Static AST)
        run: |
          python -m unittest tests/unit/test_package_boundaries.py -v

      - name: Run Intentional Failing Fixtures (Confirm Failure Detection)
        run: |
          python -m unittest tests/unit/test_ci_failure_mode.py -v

      - name: Run Complete Unit Test Suite
        run: |
          python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run Pytest Suite with Gate Markers
        run: |
          pytest tests/unit/ -v
